<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <defs>
    <radialGradient id="glow4" cx="200" cy="210" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5A3825" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#241812" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mochaCup" x1="148" y1="200" x2="252" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#F5EBDD"/>
      <stop offset="100%" stop-color="#A88860"/>
    </linearGradient>
    <radialGradient id="mochaLiquid" cx="200" cy="215" r="55" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D2417"/>
      <stop offset="70%" stop-color="#241812"/>
      <stop offset="100%" stop-color="#18100C"/>
    </radialGradient>
    <radialGradient id="whipGrad" cx="200" cy="178" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F5EBDD"/>
      <stop offset="100%" stop-color="#D8C3A5"/>
    </radialGradient>
  </defs>
  <rect width="400" height="420" fill="#241812"/>
  <circle cx="200" cy="210" r="165" fill="url(#glow4)"/>
  <!-- shadow -->
  <ellipse cx="200" cy="345" rx="95" ry="15" fill="#18100C" opacity="0.75"/>
  <!-- saucer -->
  <ellipse cx="200" cy="340" rx="108" ry="19" fill="#D8C3A5"/>
  <ellipse cx="200" cy="337" rx="94" ry="13" fill="#EBD9C0"/>
  <!-- cup body – wider mocha mug -->
  <path d="M148 215 H252 C245 295 225 335 200 335 C175 335 155 295 148 215 Z" fill="url(#mochaCup)"/>
  <!-- handle -->
  <path d="M252 235 C282 235 292 258 292 275 C292 292 276 308 252 310" stroke="#D8C3A5" stroke-width="20" stroke-linecap="round" fill="none"/>
  <path d="M252 235 C278 235 285 257 285 274 C285 290 271 307 252 309" stroke="#9C8366" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- cup lip/rim -->
  <ellipse cx="200" cy="215" rx="52" ry="14" fill="#F5EBDD"/>
  <!-- coffee surface -->
  <ellipse cx="200" cy="215" rx="48" ry="12" fill="url(#mochaLiquid)"/>
  <!-- whipped cream cloud on top -->
  <ellipse cx="200" cy="200" rx="52" ry="24" fill="url(#whipGrad)"/>
  <!-- whip texture swirls -->
  <path d="M165 198 Q180 190 195 196 Q208 190 220 196 Q232 190 240 198" stroke="#D8C3A5" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M172 205 Q185 198 200 202 Q214 198 228 205" stroke="#D8C3A5" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Belgian chocolate drizzle over whip -->
  <path d="M178 188 Q192 182 207 188 Q218 184 228 189" stroke="#5A3825" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M183 196 Q197 190 213 196" stroke="#5A3825" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Dutch cocoa dusting -->
  <circle cx="185" cy="184" r="3" fill="#5A3825" opacity="0.5"/>
  <circle cx="202" cy="180" r="2.5" fill="#5A3825" opacity="0.4"/>
  <circle cx="218" cy="185" r="3" fill="#5A3825" opacity="0.5"/>
  <circle cx="193" cy="192" r="2" fill="#5A3825" opacity="0.35"/>
  <circle cx="210" cy="190" r="2" fill="#5A3825" opacity="0.35"/>
  <!-- tiny steam for warmth -->
  <path d="M185 158 C179 140 192 128 184 110" stroke="#F5EBDD" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M215 158 C221 140 208 128 216 110" stroke="#F5EBDD" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>