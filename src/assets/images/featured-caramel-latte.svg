<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <defs>
    <radialGradient id="glow1" cx="200" cy="200" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8612E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F1612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cupGrad1" x1="140" y1="180" x2="260" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FBF7F1"/>
      <stop offset="100%" stop-color="#EADBC8"/>
    </linearGradient>
    <linearGradient id="coffeeGrad1" x1="160" y1="190" x2="240" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A27E"/>
      <stop offset="100%" stop-color="#1F1612"/>
    </linearGradient>
  </defs>
  <!-- bg -->
  <rect width="400" height="420" fill="#1F1612"/>
  <circle cx="200" cy="210" r="170" fill="url(#glow1)"/>
  <!-- saucer shadow -->
  <ellipse cx="200" cy="345" rx="95" ry="16" fill="#1F1612" opacity="0.7"/>
  <!-- saucer -->
  <ellipse cx="200" cy="340" rx="110" ry="20" fill="#EADBC8"/>
  <ellipse cx="200" cy="337" rx="95" ry="14" fill="#EBD9C0"/>
  <!-- cup body -->
  <path d="M148 200 H252 C245 285 225 330 200 330 C175 330 155 285 148 200Z" fill="url(#cupGrad1)"/>
  <!-- handle -->
  <path d="M252 220 C285 220 295 245 295 265 C295 285 278 305 252 305" stroke="#EADBC8" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M252 220 C280 220 288 244 288 265 C288 284 274 304 252 304" stroke="#9C8366" stroke-opacity="0.4" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- rim -->
  <ellipse cx="200" cy="200" rx="52" ry="14" fill="#FBF7F1"/>
  <ellipse cx="200" cy="200" rx="48" ry="12" fill="url(#coffeeGrad1)"/>
  <!-- caramel drizzle on coffee surface -->
  <path d="M180 196 Q200 202 220 196" stroke="#A8612E" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M188 200 Q200 208 212 200" stroke="#A8612E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- foam heart -->
  <path d="M196 194 C193 190 185 190 185 196 C185 200 192 205 200 210 C208 205 215 200 215 196 C215 190 207 190 204 194 C202 192 198 192 196 194Z" fill="#FBF7F1" opacity="0.9"/>
  <!-- steam -->
  <path d="M178 165 C168 140 188 125 175 100" stroke="#EADBC8" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M200 158 C188 130 208 112 195 85" stroke="#FBF7F1" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M222 165 C232 140 212 125 225 100" stroke="#EADBC8" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- caramel drizzle exterior -->
  <path d="M165 235 Q170 242 175 235" stroke="#A8612E" stroke-opacity="0.6" stroke-width="2" fill="none"/>
</svg>