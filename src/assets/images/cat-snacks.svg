<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" fill="none">
  <defs>
    <radialGradient id="snackGlow" cx="200" cy="210" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A8612E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1F1612" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateGrad" x1="100" y1="310" x2="300" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EADBC8"/>
    </linearGradient>
    <linearGradient id="breadGrad" x1="130" y1="180" x2="270" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EADBC8"/>
      <stop offset="50%" stop-color="#A8612E"/>
      <stop offset="100%" stop-color="#C9A27E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="420" fill="#1F1612"/>
  <circle cx="200" cy="210" r="165" fill="url(#snackGlow)"/>
  <!-- Plate shadow -->
  <ellipse cx="200" cy="340" rx="115" ry="20" fill="#1F1612" opacity="0.7"/>
  <!-- Ceramic Plate -->
  <ellipse cx="200" cy="330" rx="130" ry="26" fill="url(#plateGrad)"/>
  <ellipse cx="200" cy="327" rx="112" ry="18" fill="#FBF7F1"/>
  
  <!-- Grilled Panini / Toast (diagonal stacked) -->
  <g transform="translate(200, 240) rotate(-12)">
    <!-- Bottom slice -->
    <path d="M-70 10 L0 -50 L70 10 L0 50 Z" fill="#C9A27E"/>
    <!-- Cheese melt layer -->
    <path d="M-65 12 L0 -42 L65 12 L0 46 Z" fill="#A8612E" opacity="0.9"/>
    <!-- Green herbs / lettuce sticking out -->
    <path d="M-55 20 Q-30 35 0 25 Q30 35 55 20" stroke="#4A7A50" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Top slice with grill marks -->
    <path d="M-68 -5 L0 -60 L68 -5 L0 40 Z" fill="url(#breadGrad)"/>
    <!-- Grill marks -->
    <line x1="-30" y1="-25" x2="20" y2="-45" stroke="#3D2417" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-20" y1="-5" x2="30" y2="-25" stroke="#3D2417" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-10" y1="15" x2="40" y2="-5" stroke="#3D2417" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Side dipping bowl -->
  <ellipse cx="105" cy="315" rx="24" ry="10" fill="#EADBC8"/>
  <ellipse cx="105" cy="313" rx="20" ry="7" fill="#A8612E"/>
  
  <!-- Garnish parsley leaves -->
  <circle cx="280" cy="305" r="4" fill="#4A7A50"/>
  <circle cx="290" cy="300" r="3" fill="#4A7A50"/>

  <text x="200" y="385" text-anchor="middle" font-family="'Playfair Display', serif" font-size="16" fill="#FBF7F1">Artisan Bites &amp; Paninis</text>
</svg>
